name: finpet
description: Питомец Финни — игровой сервис финансовой грамотности для детей 7–11 лет.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  flutter_animate: ^4.5.2
  model_viewer_plus: ^1.10.0
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  audioplayers: ^6.8.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
    - assets/models/finni/
    - assets/audio/
